name: Python quality

on:
  pull_request:
    paths: &quality-paths
      - 'framework/scripts/**/*.py'
      - 'framework/scripts/requirements.txt'
      - '.github/workflows/python-quality.yml'
      - '**/pyproject.toml'
      - '**/ruff.toml'
      - '**/.ruff.toml'
      - '**/.gitignore'
      - '**/.ignore'
      - '**/.gitattributes'
  push:
    branches: [main, master]
    paths: *quality-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install pinned Ruff only
        run: python -m pip install "$(sed -n '/^ruff==/p' framework/scripts/requirements.txt)"
      - run: python -B framework/scripts/python_quality.py
