name: Python quality

on:
  pull_request:
    paths: ['framework/scripts/**/*.py', 'pyproject.toml', 'framework/scripts/requirements.txt', '.github/workflows/python-quality.yml']
  push:
    branches: [main, master]
    paths: ['framework/scripts/**/*.py', 'pyproject.toml', 'framework/scripts/requirements.txt', '.github/workflows/python-quality.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install pinned Ruff only
        run: python -m pip install "$(sed -n '/^ruff==/p' framework/scripts/requirements.txt)"
      - run: python -m ruff check framework/scripts
      - run: python -B framework/scripts/python_structure.py
