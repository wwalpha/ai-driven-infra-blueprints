name: Framework IT

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Optional baseline commit for one before/after measurement on this runner'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  framework-it:
    name: Framework IT
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: framework/scripts/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r framework/scripts/requirements.txt
      - name: Install Pandoc for PDF verification
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Install Terraform CLI for integration verification
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.16.1'
          terraform_wrapper: false
      - name: Checkout measurement baseline
        if: github.event_name == 'workflow_dispatch' && inputs.baseline_ref != ''
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.baseline_ref }}
          path: .it-baseline
          persist-credentials: false
      - name: Run all IT
        env:
          IT_BASELINE: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_ref != '' && '.it-baseline' || '' }}
        run: python -B framework/scripts/tests/run_it.py --it-only --baseline-root "$IT_BASELINE"
