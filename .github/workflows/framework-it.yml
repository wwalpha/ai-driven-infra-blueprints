name: Framework IT

on:
  pull_request:
    paths: ['**.py', 'framework/scripts/tests/fixtures/**', 'framework/scripts/tests/pytest.ini', 'framework/scripts/tests/CASES.md', 'framework/scripts/requirements*.txt', '.github/workflows/framework-it.yml']
  push:
    branches: [main, master]
    paths: ['**.py', 'framework/scripts/tests/fixtures/**', 'framework/scripts/tests/pytest.ini', 'framework/scripts/tests/CASES.md', 'framework/scripts/requirements*.txt', '.github/workflows/framework-it.yml']
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Optional baseline commit for one before/after measurement on this runner'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  framework-it:
    name: Framework IT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: framework/scripts/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r framework/scripts/requirements.txt
      - name: Checkout measurement baseline
        if: github.event_name == 'workflow_dispatch' && inputs.baseline_ref != ''
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.baseline_ref }}
          path: .it-baseline
          persist-credentials: false
      - name: Run affected UT and IT cases (manual dispatch runs full IT)
        env:
          IT_BASELINE: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_ref != '' && '.it-baseline' || '' }}
          IT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          IT_EVENT: ${{ github.event_name }}
        run: |
          if [ "$IT_EVENT" = workflow_dispatch ]; then
            python -B framework/scripts/tests/run_it.py --baseline-root "$IT_BASELINE"
          else
            python -B framework/scripts/tests/run_it.py --affected "$IT_BASE"
          fi
