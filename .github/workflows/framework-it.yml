name: Framework IT

on:
  pull_request:
    paths: ['**.py']
  push:
    branches: [main, master]
    paths: ['**.py']
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Optional baseline commit for one before/after measurement on this runner'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  framework-it:
    name: Framework IT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: framework/scripts/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r framework/scripts/requirements.txt
      - name: Prepare fixed legacy migration runtime
        run: |
          git clone --shared --no-checkout . "$RUNNER_TEMP/model-v1-framework"
          git -C "$RUNNER_TEMP/model-v1-framework" checkout --detach d0c5824fed507db234a7532a309b3c8c3482fb60
          python -m venv "$RUNNER_TEMP/model-v1-python"
          "$RUNNER_TEMP/model-v1-python/bin/python" -m pip install -r "$RUNNER_TEMP/model-v1-framework/framework/scripts/requirements.txt"
      - name: Checkout measurement baseline
        if: github.event_name == 'workflow_dispatch' && inputs.baseline_ref != ''
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.baseline_ref }}
          path: .it-baseline
          persist-credentials: false
      - name: Run all integration suites
        env:
          IT_BASELINE: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_ref != '' && '.it-baseline' || '' }}
          BLUEPRINT_LEGACY_FRAMEWORK: ${{ runner.temp }}/model-v1-framework
          BLUEPRINT_LEGACY_PYTHON: ${{ runner.temp }}/model-v1-python/bin/python
        run: python -B framework/scripts/tests/run_it.py --baseline-root "$IT_BASELINE"
