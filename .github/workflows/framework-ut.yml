name: Framework UT

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      merged: ${{ steps.classify.outputs.merged }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          AFTER: ${{ github.event.after }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          merged = False
          try:
              url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['AFTER']}/pulls"
              for page in range(1, 11):
                  request = urllib.request.Request(
                      f'{url}?per_page=100&page={page}',
                      headers={'Accept': 'application/vnd.github+json',
                               'Authorization': f"Bearer {os.environ['GH_TOKEN']}"},
                  )
                  with urllib.request.urlopen(request, timeout=10) as response:
                      pulls = json.load(response)
                  if not isinstance(pulls, list):
                      raise ValueError('response is not a list')
                  for pr in pulls:
                      if (not isinstance(pr, dict) or 'merged_at' not in pr or
                          not isinstance(pr.get('base'), dict) or not isinstance(pr['base'].get('ref'), str) or
                          'merge_commit_sha' not in pr or
                          not isinstance(pr['merged_at'], (str, type(None))) or
                          not isinstance(pr['merge_commit_sha'], (str, type(None)))):
                          raise ValueError('invalid pull request response')
                      if pr['merged_at'] and pr['base']['ref'] == 'master' and pr['merge_commit_sha'] == os.environ['AFTER']:
                          merged = True
                  if len(pulls) < 100:
                      break
              else:
                  raise ValueError('pagination limit exceeded')
          except Exception as error:
              merged = False
              print(f'::warning::Unable to classify master push; running UT: {type(error).__name__}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f'merged={str(merged).lower()}', file=output)
          PY

  framework-ut:
    name: Framework UT
    needs: classify-push
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.classify-push.outputs.merged != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: framework/scripts/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r framework/scripts/requirements.txt
      - name: Run all UT
        run: python -B framework/scripts/tests/run_it.py --ut-only
