name: Framework UT

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework-ut:
    name: Framework UT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: framework/scripts/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r framework/scripts/requirements.txt
      - name: Run all UT
        run: python -B framework/scripts/tests/run_it.py --ut-only
