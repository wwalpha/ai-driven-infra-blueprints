review_policy: 全名称を保持し、AUTO_PASS以外だけをLLM Reviewする。必須条件と適用が証明されたPatternを検査する。未確認componentを名前から推測せず、その不足だけでIssueや未検証にしない。推奨形式との差異、追加要素、省略可能要素だけではIssueにしない。必須条件の検査不能はREVIEW_REQUIREDに残す。既存の機械診断とHuman
  confirmationは全件確認する。applied_ruleは対象Pattern、rule_missingは共通規則path、provider_constraintはprovider_errorsを指定する。confirmed_mismatchは一意に証明されたcomponentの期待値と実値を要求する。
