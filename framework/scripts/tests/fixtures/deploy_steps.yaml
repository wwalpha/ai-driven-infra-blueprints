version: 1
cases:
  checkpoint-pending:
    data:
      states:
        A:
          status: SUCCESS
          observedSynced: true
      context:
        snapshotValidation: PASS
        taskFile: tasks/deploy.md
      phase: deploy
      taskStatus: completed
  failed-unstarted:
    data:
      states:
        A:
          status: SUCCESS
          observedSynced: true
        B:
          status: FAILED
          observedSynced: true
        C:
          status: NOT_STARTED
          observedSynced: true
      context:
        deployResult: FAIL
        snapshotValidation: PASS
  unknown-poll:
    data:
      orders:
      - 10
      completions:
        A:
        - UNRECOGNIZED
  intermediate-not-started:
    data:
      status: NOT_STARTED
  intermediate-ready:
    data:
      status: READY
  request-identity-input:
    data:
      record:
        operation: execute_change_set
        name: A
        stackId: stack
        changeSetId: change
        token: own
      change:
        ChangeSetId: change
        StackId: stack
        ExecutionStatus: EXECUTE_COMPLETE
      current:
        StackId: stack
        StackStatus: UPDATE_COMPLETE
  settled-order-input:
    data:
      orders:
      - 10
      - 20
  completion-task-input:
    files:
      task.md: '## Task contract

        - Task type: `infrastructure`

        - Infrastructure phase: `deploy`

        '
