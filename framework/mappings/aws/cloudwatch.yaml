version: 3
service: cloudwatch
getters:
  provider-cloudwatch-alarm:
    kind: cloudcontrol
    service: cloudcontrol
    operation: get_resource
    result: ResourceDescription.Properties
    resourceType: CloudWatch.Alarm
    identifier: [/properties/AlarmName]
  provider-cloudwatch-dashboard:
