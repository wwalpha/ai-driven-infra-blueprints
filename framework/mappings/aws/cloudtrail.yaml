version: 3
service: cloudtrail
getters:
  base:
    kind: adapter
    resources: [CloudTrail.Trail]
  provider-cloudtrail-trail:
    kind: cloudcontrol
    service: cloudcontrol
    operation: get_resource
    result: ResourceDescription.Properties
    resourceType: CloudTrail.Trail
    identifier: [/properties/TrailName]
  selectors:
    kind: adapter
    resources: [CloudTrail.Trail]
  status:
    kind: adapter
    resources: [CloudTrail.Trail]
resourceTypes:
  CloudTrail.Trail:
    identity:
      getter: base
      idPath: Name
      arnPath: TrailARN
      nameProperty: TrailName
    properties:
      TrailName:
        model: {include: true}
        display: {show: true, name: TrailName}
        access: [create-only]
        aws: {getter: base, path: Name, normalize: typed}
      AdvancedEventSelectors[].FieldSelectors[].EndsWith:
        model: {include: false}
        display: {show: false, name: 'AdvancedEventSelectors[].FieldSelectors[].EndsWith'}
        access: [read-write]
        aws: {getter: provider-cloudtrail-trail, path: 'AdvancedEventSelectors[].FieldSelectors[].EndsWith', normalize: typed}
      AdvancedEventSelectors[].FieldSelectors[].Equals:
        model: {include: false}
        display: {show: false, name: 'AdvancedEventSelectors[].FieldSelectors[].Equals'}
        access: [read-write]
        aws: {getter: provider-cloudtrail-trail, path: 'AdvancedEventSelectors[].FieldSelectors[].Equals', normalize: typed}
      AdvancedEventSelectors[].FieldSelectors[].Field:
