        access: [read-write]
        aws: {getter: provider-cloudtrail-trail, path: 'AdvancedEventSelectors[].FieldSelectors[].Field', normalize: typed}
      AdvancedEventSelectors[].FieldSelectors[].NotEndsWith:
        model: {include: false}
        display: {show: false, name: 'AdvancedEventSelectors[].FieldSelectors[].NotEndsWith'}
        access: [read-write]
        aws: {getter: provider-cloudtrail-trail, path: 'AdvancedEventSelectors[].FieldSelectors[].NotEndsWith', normalize: typed}
      AdvancedEventSelectors[].FieldSelectors[].NotEquals:
        model: {include: false}
        display: {show: false, name: 'AdvancedEventSelectors[].FieldSelectors[].NotEquals'}
        access: [read-write]
        aws: {getter: provider-cloudtrail-trail, path: 'AdvancedEventSelectors[].FieldSelectors[].NotEquals', normalize: typed}
      AdvancedEventSelectors[].FieldSelectors[].NotStartsWith:
        model: {include: false}
        display: {show: false, name: 'AdvancedEventSelectors[].FieldSelectors[].NotStartsWith'}
        access: [read-write]
        aws: {getter: provider-cloudtrail-trail, path: 'AdvancedEventSelectors[].FieldSelectors[].NotStartsWith', normalize: typed}
      AdvancedEventSelectors[].FieldSelectors[].StartsWith:
        model: {include: false}
        display: {show: false, name: 'AdvancedEventSelectors[].FieldSelectors[].StartsWith'}
        access: [read-write]
        aws: {getter: provider-cloudtrail-trail, path: 'AdvancedEventSelectors[].FieldSelectors[].StartsWith', normalize: typed}
      AdvancedEventSelectors[].Name:
        model: {include: false}
        display: {show: false, name: 'AdvancedEventSelectors[].Name'}
        access: [read-write]
        aws: {getter: provider-cloudtrail-trail, path: 'AdvancedEventSelectors[].Name', normalize: typed}
      CloudWatchLogsLogGroupArn:
        model: {include: true}
        display: {show: true, name: CloudWatchLogsLogGroupArn}
        access: [read-write]
        aws: {getter: base, path: CloudWatchLogsLogGroupArn, normalize: log_group_arn}
      CloudWatchLogsRoleArn:
        model: {include: true}
        display: {show: true, name: CloudWatchLogsRoleArn}
        access: [read-write]
        aws: {getter: base, path: CloudWatchLogsRoleArn, normalize: arn}
