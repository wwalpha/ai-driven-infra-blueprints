version: 3
service: security-group
getters:
  group:
    kind: adapter
    resources: [EC2.SecurityGroup]
  provider-ec2-securitygroup:
    kind: cloudcontrol
    service: cloudcontrol
    operation: get_resource
    result: ResourceDescription.Properties
    resourceType: EC2.SecurityGroup
    identifier: [/properties/Id]
  rule:
    kind: adapter
    resources: [EC2.SecurityGroupEgress, EC2.SecurityGroupIngress]
  provider-ec2-securitygroupegress:
    kind: cloudcontrol
    service: cloudcontrol
    operation: get_resource
    result: ResourceDescription.Properties
    resourceType: EC2.SecurityGroupEgress
    identifier: [/properties/Id]
  provider-ec2-securitygroupingress:
    kind: cloudcontrol
    service: cloudcontrol
    operation: get_resource
    result: ResourceDescription.Properties
    resourceType: EC2.SecurityGroupIngress
    identifier: [/properties/Id]
resourceTypes:
  EC2.SecurityGroup:
    identity:
      getter: group
      idPath: GroupId
      arnPath: null
      nameProperty: GroupName
    properties:
      GroupName:
        model: {include: true}
        display: {show: true, name: GroupName}
        access: [create-only]
        aws: {getter: group, path: GroupName, normalize: typed}
      Id:
        model: {include: true}
        display: {show: true, name: Id}
        access: [read-only]
        aws: {getter: group, path: GroupId, normalize: typed}
      GroupDescription:
        model: {include: true}
        display: {show: true, name: GroupDescription}
        access: [create-only]
        aws: {getter: group, path: Description, normalize: typed}
      SecurityGroupEgress[].CidrIp:
        model: {include: true}
        display: {show: true, name: 'SecurityGroupEgress[].CidrIp'}
        access: [read-write]
        aws: {getter: group, path: 'SecurityGroupEgress[].CidrIp', normalize: typed}
      SecurityGroupEgress[].CidrIpv6:
        model: {include: false}
        display: {show: false, name: 'SecurityGroupEgress[].CidrIpv6'}
        access: [read-write]
        aws: {getter: provider-ec2-securitygroup, path: 'SecurityGroupEgress[].CidrIpv6', normalize: typed}
      SecurityGroupEgress[].Description:
        model: {include: true}
        display: {show: true, name: 'SecurityGroupEgress[].Description'}
        access: [read-write]
        aws: {getter: group, path: 'SecurityGroupEgress[].Description', normalize: typed}
      SecurityGroupEgress[].DestinationPrefixListId:
        model: {include: false}
        display: {show: false, name: 'SecurityGroupEgress[].DestinationPrefixListId'}
        access: [read-write]
        aws: {getter: provider-ec2-securitygroup, path: 'SecurityGroupEgress[].DestinationPrefixListId', normalize: typed}
      SecurityGroupEgress[].DestinationSecurityGroupId:
        model: {include: true}
        display: {show: true, name: 'SecurityGroupEgress[].DestinationSecurityGroupId'}
        access: [read-write]
        aws: {getter: group, path: 'SecurityGroupEgress[].DestinationSecurityGroupId', normalize: id}
      SecurityGroupEgress[].FromPort:
        model: {include: true}
        display: {show: true, name: 'SecurityGroupEgress[].FromPort'}
        access: [read-write]
        aws: {getter: group, path: 'SecurityGroupEgress[].FromPort', normalize: typed}
      SecurityGroupEgress[].IpProtocol:
        model: {include: true}
        display: {show: true, name: 'SecurityGroupEgress[].IpProtocol'}
        access: [read-write]
        aws: {getter: group, path: 'SecurityGroupEgress[].IpProtocol', normalize: protocol}
      SecurityGroupEgress[].ToPort:
        model: {include: true}
        display: {show: true, name: 'SecurityGroupEgress[].ToPort'}
        access: [read-write]
        aws: {getter: group, path: 'SecurityGroupEgress[].ToPort', normalize: typed}
      SecurityGroupIngress[].CidrIp:
        model: {include: true}
        display: {show: true, name: 'SecurityGroupIngress[].CidrIp'}
        access: [read-write]
        aws: {getter: group, path: 'SecurityGroupIngress[].CidrIp', normalize: typed}
      SecurityGroupIngress[].CidrIpv6:
        model: {include: false}
