        access: [read-write]
        aws: {getter: provider-ec2-securitygroup, path: 'SecurityGroupIngress[].CidrIpv6', normalize: typed}
      SecurityGroupIngress[].Description:
        model: {include: true}
        display: {show: true, name: 'SecurityGroupIngress[].Description'}
        access: [read-write]
        aws: {getter: group, path: 'SecurityGroupIngress[].Description', normalize: typed}
      SecurityGroupIngress[].FromPort:
        model: {include: true}
        display: {show: true, name: 'SecurityGroupIngress[].FromPort'}
        access: [read-write]
        aws: {getter: group, path: 'SecurityGroupIngress[].FromPort', normalize: typed}
      SecurityGroupIngress[].IpProtocol:
        model: {include: true}
        display: {show: true, name: 'SecurityGroupIngress[].IpProtocol'}
        access: [read-write]
        aws: {getter: group, path: 'SecurityGroupIngress[].IpProtocol', normalize: protocol}
      SecurityGroupIngress[].SourcePrefixListId:
        model: {include: false}
        display: {show: false, name: 'SecurityGroupIngress[].SourcePrefixListId'}
        access: [read-write]
        aws: {getter: provider-ec2-securitygroup, path: 'SecurityGroupIngress[].SourcePrefixListId', normalize: typed}
      SecurityGroupIngress[].SourceSecurityGroupId:
        model: {include: false}
        display: {show: false, name: 'SecurityGroupIngress[].SourceSecurityGroupId'}
        access: [read-write]
        aws: {getter: group, path: 'SecurityGroupIngress[].SourceSecurityGroupId', normalize: id}
      SecurityGroupIngress[].SourceSecurityGroupOwnerId:
        model: {include: false}
        display: {show: false, name: 'SecurityGroupIngress[].SourceSecurityGroupOwnerId'}
        access: [read-write]
        aws: {getter: provider-ec2-securitygroup, path: 'SecurityGroupIngress[].SourceSecurityGroupOwnerId', normalize: typed}
      SecurityGroupIngress[].ToPort:
        model: {include: true}
        display: {show: true, name: 'SecurityGroupIngress[].ToPort'}
        access: [read-write]
        aws: {getter: group, path: 'SecurityGroupIngress[].ToPort', normalize: typed}
      Tags[].Key:
        model: {include: true}
        display: {show: true, name: 'Tags[].Key'}
        access: [read-write]
        aws: {getter: group, path: 'Tags[].Key', normalize: typed}
      Tags[].Value:
        model: {include: true}
        display: {show: true, name: 'Tags[].Value'}
        access: [read-write]
        aws: {getter: group, path: 'Tags[].Value', normalize: typed}
      VpcId:
        model: {include: true}
        display: {show: true, name: VpcId}
        access: [create-only]
        aws: {getter: group, path: VpcId, normalize: id}
