version: 3
service: config-rules
getters:
  provider-config-configrule:
    kind: cloudcontrol
    service: cloudcontrol
    operation: get_resource
    result: ResourceDescription.Properties
    resourceType: Config.ConfigRule
    identifier: [/properties/ConfigRuleName]
  sdk-config-configrule:
    kind: sdk
    service: config
    operation: describe_config_rules
    result: ConfigRules[]
    resourceType: Config.ConfigRule
resourceTypes:
