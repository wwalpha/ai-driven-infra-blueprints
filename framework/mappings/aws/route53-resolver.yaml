    properties:
      Name:
        model: {include: false}
        display: {show: false, name: Name}
        access: [create-only]
        aws: {getter: provider-route53resolver-resolverruleassociation, path: Name, normalize: typed}
      ResolverRuleAssociationId:
        model: {include: false}
        display: {show: false, name: ResolverRuleAssociationId}
        access: [read-only]
        aws: {getter: provider-route53resolver-resolverruleassociation, path: ResolverRuleAssociationId, normalize: typed}
      ResolverRuleId:
        model: {include: false}
        display: {show: false, name: ResolverRuleId}
        access: [create-only]
        aws: {getter: provider-route53resolver-resolverruleassociation, path: ResolverRuleId, normalize: typed}
      VPCId:
        model: {include: false}
        display: {show: false, name: VPCId}
        access: [create-only]
        aws: {getter: provider-route53resolver-resolverruleassociation, path: VPCId, normalize: typed}
