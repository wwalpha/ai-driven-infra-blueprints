        access: [read-write]
        aws: {getter: provider-route53resolver-resolverrule, path: 'Tags[].Key', normalize: typed}
      Tags[].Value:
        model: {include: false}
        display: {show: false, name: 'Tags[].Value'}
        access: [read-write]
        aws: {getter: provider-route53resolver-resolverrule, path: 'Tags[].Value', normalize: typed}
      TargetIps[].Ip:
        model: {include: false}
        display: {show: false, name: 'TargetIps[].Ip'}
        access: [read-write]
        aws: {getter: provider-route53resolver-resolverrule, path: 'TargetIps[].Ip', normalize: typed}
      TargetIps[].Port:
        model: {include: false}
        display: {show: false, name: 'TargetIps[].Port'}
        access: [read-write]
        aws: {getter: provider-route53resolver-resolverrule, path: 'TargetIps[].Port', normalize: typed}
      TargetIps[].Protocol:
        model: {include: false}
        display: {show: false, name: 'TargetIps[].Protocol'}
        access: [read-write]
        aws: {getter: provider-route53resolver-resolverrule, path: 'TargetIps[].Protocol', normalize: typed}
      TargetIps[].ServerNameIndication:
        model: {include: false}
        display: {show: false, name: 'TargetIps[].ServerNameIndication'}
        access: [read-write]
        aws: {getter: provider-route53resolver-resolverrule, path: 'TargetIps[].ServerNameIndication', normalize: typed}
