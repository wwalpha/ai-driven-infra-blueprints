version: 3
service: ecs
getters:
  provider-ecs-capacityprovider:
    kind: cloudcontrol
    service: cloudcontrol
    operation: get_resource
    result: ResourceDescription.Properties
    resourceType: ECS.CapacityProvider
    identifier: [/properties/Name]
  provider-ecs-cluster:
    kind: cloudcontrol
    service: cloudcontrol
    operation: get_resource
    result: ResourceDescription.Properties
    resourceType: ECS.Cluster
    identifier: [/properties/ClusterName]
  sdk-ecs-cluster:
    kind: sdk
    service: ecs
    operation: describe_clusters
    result: clusters[]
    resourceType: ECS.Cluster
  provider-ecs-clustercapacityproviderassociations:
    kind: cloudcontrol
    service: cloudcontrol
    operation: get_resource
    result: ResourceDescription.Properties
    resourceType: ECS.ClusterCapacityProviderAssociations
    identifier: [/properties/Cluster]
  provider-ecs-service:
    kind: cloudcontrol
    service: cloudcontrol
    operation: get_resource
    result: ResourceDescription.Properties
    resourceType: ECS.Service
    identifier: [/properties/ServiceArn, /properties/Cluster]
  provider-ecs-taskdefinition:
    kind: cloudcontrol
    service: cloudcontrol
    operation: get_resource
    result: ResourceDescription.Properties
    resourceType: ECS.TaskDefinition
    identifier: [/properties/TaskDefinitionArn]
